services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: drishti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["drishti_db:/var/lib/postgresql/data"]
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  drishti_db:

